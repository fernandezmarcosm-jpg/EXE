name: Validar GestionSO V57 Minimal - one-shot layout

on:
  workflow_dispatch:
  push:
    branches: [main, reconstruccion-grilla-edicion]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validar:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply layout patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message != 'Fix: layout del diálogo de configuración sin superposición'
        shell: pwsh
        run: |
          $p = 'column_view_windows.go'
          $s = [IO.File]::ReadAllText($p)
          $s = $s.Replace('WS_OVERLAPPEDWINDOW|WS_VISIBLE, 300, 120, 760, 570, parent', 'WS_OVERLAPPEDWINDOW|WS_VISIBLE, 300, 120, 760, 510, parent')
          $s = $s.Replace('appMake(configHwnd,"STATIC","Insertar columna en fórmula",WS_CHILD|WS_VISIBLE,20,310,300,22,0)', 'appMake(configHwnd,"STATIC","Insertar columna en fórmula",WS_CHILD|WS_VISIBLE,20,308,300,22,0)')
          $s = $s.Replace('configFormulaSelector=appMake(configHwnd,"COMBOBOX","",WS_CHILD|WS_VISIBLE|WS_TABSTOP|WS_BORDER,325,308,360,180,configIDFormulaColumns)', 'configFormulaSelector=appMake(configHwnd,"LISTBOX","",WS_CHILD|WS_VISIBLE|WS_BORDER|WS_VSCROLL|0x0001|0x0100,325,306,360,110,configIDFormulaColumns)')
          $s = $s.Replace('if viewDataset!=nil { for _,c:=range viewDataset.Columns { user32.NewProc("SendMessageW").Call(configFormulaSelector,cbAddString,0,reflect.ValueOf(appU16(formulaTokenName(c))).Pointer()) } }', 'if viewDataset!=nil { for _,c:=range viewDataset.Columns { user32.NewProc("SendMessageW").Call(configFormulaSelector,0x0180,0,reflect.ValueOf(appU16(formulaTokenName(c))).Pointer()) } }')
          $s = $s.Replace('check:=appMake(configHwnd,"BUTTON","Subtotal habilitado",WS_CHILD|WS_VISIBLE|WS_TABSTOP|0x3,20,350,200,26,configIDSubtotalCheck)', 'check:=appMake(configHwnd,"BUTTON","Subtotal habilitado",WS_CHILD|WS_VISIBLE|WS_TABSTOP|0x3,20,425,200,26,configIDSubtotalCheck)')
          $s = $s.Replace('280,405,115,30,configIDNames); appMake(configHwnd,"BUTTON","GUARDAR",WS_CHILD|WS_VISIBLE|WS_TABSTOP,400,405,100,30,configIDOK); appMake(configHwnd,"BUTTON","CANCELAR",WS_CHILD|WS_VISIBLE|WS_TABSTOP,510,405,100,30,configIDCancel)', '280,445,115,30,configIDNames); appMake(configHwnd,"BUTTON","GUARDAR",WS_CHILD|WS_VISIBLE|WS_TABSTOP,400,445,100,30,configIDOK); appMake(configHwnd,"BUTTON","CANCELAR",WS_CHILD|WS_VISIBLE|WS_TABSTOP,510,445,100,30,configIDCancel)')
          $s = $s -replace '(?m)^\s*cbAddString = 0x143\r?\n',''
          if ($s -match 'configFormulaSelector=appMake\(configHwnd,"COMBOBOX"') { throw 'Old COMBOBOX still present' }
          [IO.File]::WriteAllText($p, $s, (New-Object System.Text.UTF8Encoding($false)))

      - name: Verify and format
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message != 'Fix: layout del diálogo de configuración sin superposición'
        shell: pwsh
        run: |
          $s = [IO.File]::ReadAllText('column_view_windows.go')
          if ($s -notmatch 'configFormulaSelector=appMake\(configHwnd,"LISTBOX"') { throw 'LISTBOX not applied' }
          if ($s -notmatch '20,425,200,26,configIDSubtotalCheck') { throw 'Subtotal position not applied' }
          if ($s -notmatch '280,445,115,30,configIDNames') { throw 'Buttons position not applied' }
          if ($s -notmatch '300, 120, 760, 510, parent') { throw 'Dialog height not applied' }
          if ($s -match 'configFormulaSelector=appMake\(configHwnd,"COMBOBOX"') { throw 'Old COMBOBOX still present' }
          if ($s -match 'cbAddString = 0x143') { throw 'Obsolete cbAddString constant remains' }
          gofmt -w column_view_windows.go

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Vet
        shell: pwsh
        run: go vet ./...

      - name: Build all packages
        shell: pwsh
        run: go build ./...

      - name: Build smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe .
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'No se genero GestionSO-V57.exe' }

      - name: Commit source change and restore workflow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message != 'Fix: layout del diálogo de configuración sin superposición'
        shell: pwsh
        run: |
          $workflow = @'
          name: Validar GestionSO V57

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          jobs:
            validar:
              runs-on: windows-latest
              env:
                CGO_ENABLED: "0"
                GOOS: windows
                GOARCH: amd64

              steps:
                - uses: actions/checkout@v4

                - name: Test
                  run: go test ./...

                - name: Vet
                  run: go vet ./...

                - name: Build all packages
                  run: go build ./...

                - name: Build smoke test
                  run: go build -trimpath -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe .
          '@
          [IO.File]::WriteAllText('.github/workflows/validar-go.yml', $workflow.TrimStart(), (New-Object System.Text.UTF8Encoding($false)))
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add column_view_windows.go .github/workflows/validar-go.yml
          git commit -m 'Fix: layout del diálogo de configuración sin superposición'
          git push origin HEAD:main
