name: Validar GestionSO V57 Minimal

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Build smoke test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe .
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'No se genero GestionSO-V57.exe' }
