name: Validar GestionSO V57 Functional

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  validar:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Test
        shell: pwsh
        run: go test ./...
      - name: Build GestionSO V57
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe .
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'No se genero GestionSO-V57.exe' }
      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/datos | Out-Null
          Copy-Item 'acceso chatgpt/GestionSO_Datos.csv' 'dist/datos/GestionSO_Datos.csv'
          Copy-Item 'acceso chatgpt/Archivo a importar.xlsx' 'dist/datos/Archivo a importar.xlsx'
          Copy-Item 'acceso chatgpt/archivo exportado.csv' 'dist/datos/archivo exportado.csv'
          Set-Content -Path dist/LEEME.txt -Encoding UTF8 -Value @(
            'GestionSO V57 - reconstruccion funcional'
            ''
            'ABRIR EXCEL: selecciona uno o varios XLSX.'
            'Los XLSX se procesan fuera del hilo de la interfaz.'
            'Los SKU se cruzan con GestionSO_Datos.csv.'
            'La grilla contiene campos calculados y campos originales.'
            'Filtro por columna: Columna=valor;Columna2=valor.'
            'COLUMNAS... permite elegir las columnas visibles.'
            'EXPORTAR CSV genera el resultado en la carpeta temporal.'
            ''
            'archivo exportado.csv se incluye solo como ejemplo de estructura/salida.'
          )
          Compress-Archive -Path dist/* -DestinationPath dist/GestionSO-V57.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.zip
          if-no-files-found: error
          retention-days: 30
