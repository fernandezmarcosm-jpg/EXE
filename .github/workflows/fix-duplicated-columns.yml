name: Fix duplicated physical columns

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'Fix: eliminar duplicación de columnas al usar COLUMNAS') == false
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix and validate
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path('column_view_windows.go')
          s=p.read_text(encoding='utf-8')
          start=s.index('func columnViewVisibleColumns() []DatasetColumn {')
          end=s.index('\n}\n\nfunc columnViewFilteredRecords', start)+2
          new='''func columnViewVisibleColumns() []DatasetColumn {
          if viewDataset == nil { return nil }
          limit := appSettings.MaxColumns
          if limit < 1 { limit = 20 }
          out := make([]DatasetColumn, 0, len(viewDataset.Columns))
          for _, c := range viewDataset.Columns {
              if !c.Visible { continue }
              if len(out) >= limit { break }
              out = append(out, c)
          }
          return out
          }'''
          s=s[:start]+new+s[end:]
          old='''\tif changed { _ = saveDatasetSettings(appSettings) }
\tcolumnViewBuildFilters()
\tcolumnViewRefresh()
\tuser32.NewProc("DestroyMenu").Call(m)
}'''
          new2='''\tif changed { _ = saveDatasetSettings(appSettings) }
\tif changed {
\t\tuser32.NewProc("SendMessageW").Call(viewList, lvmSetItemCountEx, 0, 0)
\t\tcolumnViewDeleteColumns()
\t\tcolumnViewBuildFilters()
\t\tcolumnViewRefresh()
\t}
\tuser32.NewProc("DestroyMenu").Call(m)
}'''
          if old not in s: raise SystemExit('show menu tail pattern not found')
          s=s.replace(old,new2,1)
          p.write_text(s,encoding='utf-8')
          Path('main_test.go').write_text(r'''//go:build windows

package main

import "testing"

func TestDuplicatedPhysicalColumns(t *testing.T) {
    oldDataset := viewDataset
    oldSettings := appSettings
    defer func() { viewDataset = oldDataset; appSettings = oldSettings }()

    viewDataset = &MemoryDataset{
        Columns: []DatasetColumn{
            {ID: "DESCRIPCION", Title: "DESCRIPCION", Visible: true},
            {ID: "CODRETENCION", Title: "CODRETENCION", Visible: true},
            {ID: "N° CLIENTE", Title: "N° CLIENTE", Visible: true},
            {ID: "DESCRIPCION_2", Title: "DESCRIPCION", Visible: true},
            {ID: "CODRETENCION_2", Title: "CODRETENCION", Visible: true},
        },
        Records: []DatasetRecord{{Values: map[string]MemoryValue{
            "DESCRIPCION": {ColumnID: "DESCRIPCION", Type: ValueText, Raw: "primera"},
            "CODRETENCION": {ColumnID: "CODRETENCION", Type: ValueText, Raw: "A"},
            "N° CLIENTE": {ColumnID: "N° CLIENTE", Type: ValueText, Raw: "1"},
            "DESCRIPCION_2": {ColumnID: "DESCRIPCION_2", Type: ValueText, Raw: "segunda"},
            "CODRETENCION_2": {ColumnID: "CODRETENCION_2", Type: ValueText, Raw: "B"},
        }}}},
    }
    appSettings = defaultDatasetSettings()
    appSettings.MaxColumns = 20
    viewDataset.Columns[0].Visible = false

    visible := columnViewVisibleColumns()
    got := make([]string, 0, len(visible))
    for _, c := range visible { got = append(got, c.ID) }
    want := []string{"CODRETENCION", "N° CLIENTE", "DESCRIPCION_2", "CODRETENCION_2"}
    if len(got) != len(want) { t.Fatalf("visible columns = %v, want %v", got, want) }
    for i := range want { if got[i] != want[i] { t.Fatalf("visible columns = %v, want %v", got, want) } }

    r := viewDataset.Records[0]
    if r.Values["DESCRIPCION_2"].Raw == r.Values["DESCRIPCION"].Raw { t.Fatalf("duplicated description values are not independent") }
    if got := r.Values["DESCRIPCION_2"].Raw; got != "segunda" { t.Fatalf("second description = %q, want %q", got, "segunda") }
}
''', encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 apply_fix.py
          python apply_fix.py
          gofmt -w column_view_windows.go main_test.go
          go vet ./...
          go test ./... -run TestDuplicatedPhysicalColumns -v
          $env:CGO_ENABLED='0'; $env:GOOS='windows'; $env:GOARCH='amd64'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags '-H=windowsgui' -o dist/GestionSO-V57.exe ./...
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'No se genero GestionSO-V57.exe' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add column_view_windows.go main_test.go
          git commit -m 'Fix: eliminar duplicación de columnas al usar COLUMNAS con encabezados físicos duplicados'
          git push origin HEAD:main
