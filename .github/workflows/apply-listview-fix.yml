name: Apply ListView fix
on:
  push:
    branches: [fix/listview-repaint-deleteobject]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[listview-fix-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          p=Path('windows_safe_view.go')
          s=p.read_text()
          old='columnViewApplyFont();appLog("DIAGNOSTICO: render síncrono completo; registros=%d",len(records))'
          new='''columnViewApplyFont();
          var clientRect struct{Left,Top,Right,Bottom int32}
          user32.NewProc("GetClientRect").Call(viewList,uintptr(unsafe.Pointer(&clientRect)))
          itemCount,_,_:=user32.NewProc("SendMessageW").Call(viewList,lvmGetItemCount,0,0)
          appLog("DIAGNOSTICO: listview client rect left=%d top=%d right=%d bottom=%d width=%d height=%d",clientRect.Left,clientRect.Top,clientRect.Right,clientRect.Bottom,clientRect.Right-clientRect.Left,clientRect.Bottom-clientRect.Top)
          if itemCount>0{
              var itemRect struct{Left,Top,Right,Bottom int32}
              itemRect.Left=0
              ok,_,_:=user32.NewProc("SendMessageW").Call(viewList,lvmGetItemRect,0,uintptr(unsafe.Pointer(&itemRect)))
              appLog("DIAGNOSTICO: item 0 rect ok=%d left=%d top=%d right=%d bottom=%d width=%d height=%d",ok,itemRect.Left,itemRect.Top,itemRect.Right,itemRect.Bottom,itemRect.Right-itemRect.Left,itemRect.Bottom-itemRect.Top)
          }
          user32.NewProc("InvalidateRect").Call(viewList,0,1)
          user32.NewProc("UpdateWindow").Call(viewList)
          appLog("DIAGNOSTICO: repintado forzado InvalidateRect+UpdateWindow; item count en listview=%d",itemCount)
          appLog("DIAGNOSTICO: render síncrono completo; registros=%d",len(records))'''
          if old not in s: raise SystemExit('safe-view target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('column_view_windows.go')
          s=p.read_text()
          s=s.replace('const(lvmSetExtended=0x1036;', 'const(lvmGetItemRect=0x100E;lvmGetItemCount=0x1004;lvmSetExtended=0x1036;', 1)
          s=s.replace('if viewFont!=0{user32.NewProc("DeleteObject").Call(viewFont);viewFont=0}', 'if viewFont!=0{gdi:=syscall.NewLazyDLL("gdi32.dll");gdi.NewProc("DeleteObject").Call(viewFont);viewFont=0}', 1)
          s=s.replace('if viewFont!=0{user32.NewProc("DeleteObject").Call(viewFont)};gdi:=syscall.NewLazyDLL("gdi32.dll")', 'if viewFont!=0{gdi:=syscall.NewLazyDLL("gdi32.dll");gdi.NewProc("DeleteObject").Call(viewFont)};gdi:=syscall.NewLazyDLL("gdi32.dll")', 1)
          p.write_text(s)

          if 'user32.NewProc("DeleteObject")' in Path('column_view_windows.go').read_text(): raise SystemExit('user32 DeleteObject remains')
          if 'user32.NewProc("LVM_SETTEXTCOLOR")' in s or 'user32.NewProc("LVM_SETTEXTBKCOLOR")' in s or 'user32.NewProc("LVM_SETBKCOLOR")' in s: raise SystemExit('unexpected color override')
      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add windows_safe_view.go column_view_windows.go
          git commit -m "Fix ListView repaint and DeleteObject DLL [listview-fix-generated]"
          git push
