name: Build GestionSO V57

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Fix XLSX selector and UI freeze
        shell: pwsh
        run: |
          $p = 'main_windows.go'
          $s = Get-Content $p -Raw -Encoding UTF8
          $pattern = 'func u16z\(s string\) \[\]uint16 \{\s*return syscall\.StringToUTF16\(s\)\s*\}'
          $replacement = 'func u16z(s string) []uint16 { parts := strings.Split(s, "\x00"); out := make([]uint16, 0, len(s)+1); for _, part := range parts { out = append(out, syscall.StringToUTF16(part)...); }; return out }'
          $s = [regex]::Replace($s, $pattern, $replacement)
          $old = 'func openXLSXDialog(owner uintptr) {'
          $new = 'func openXLSXDialogSync(owner uintptr) {'
          if (-not $s.Contains($old)) { throw 'openXLSXDialog function not found in main_windows.go' }
          $s = $s.Replace($old, $new)
          Set-Content $p $s -Encoding UTF8 -NoNewline
      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags '-H=windowsgui' -o dist/GestionSO-V57.exe .
      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/datos | Out-Null
          Copy-Item 'acceso chatgpt/GestionSO_Datos.csv' 'dist/datos/GestionSO_Datos.csv'
          Copy-Item 'acceso chatgpt/archivo exportado.csv' 'dist/datos/archivo exportado.csv'
          Copy-Item 'acceso chatgpt/Archivo a importar.xlsx' 'dist/datos/Archivo a importar.xlsx'
          Compress-Archive -Path dist/GestionSO-V57.exe,dist/datos/* -DestinationPath dist/GestionSO-V57.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.zip
          if-no-files-found: error
