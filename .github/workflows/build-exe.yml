name: Build GestionSO V57

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # PowerShell no acepta la sintaxis POSIX CGO_ENABLED=0 delante del comando.
      # Las variables quedan en el entorno del job para que go build/go vet las reciban.
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false

      - name: Download dependencies
        run: |
          go mod download
          go mod tidy

      - name: Build GestionSO V57
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe ./...

      - name: go vet
        run: go vet ./...

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.exe
          retention-days: 30
