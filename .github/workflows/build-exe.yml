name: Build GestionSO V57

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
          cache: false

      - name: Blindaje selector XLSX
        shell: pwsh
        run: |
          $path = 'main_windows.go'
          $text = Get-Content -Raw -Encoding UTF8 $path
          $pattern = '(?m)^\s*Flags:\s+OFN_EXPLORER \| OFN_FILEMUSTEXIST \| OFN_ALLOWMULTISELECT \| OFN_HIDEREADONLY \| OFN_ENABLEHOOK,\r?\n\s*lpfnHook:\s+syscall\.NewCallback\(multiSelectHook\),'
          $replacement = "`t`tFlags:       OFN_EXPLORER | OFN_FILEMUSTEXIST | OFN_ALLOWMULTISELECT | OFN_HIDEREADONLY,`r`n`t`tlpfnHook:    0,"
          $updated = [regex]::Replace($text, $pattern, $replacement, 1)
          if ($updated -eq $text) {
            throw 'No se encontro el bloque del hook XLSX esperado; se cancela la compilacion para no alterar otra logica.'
          }
          Set-Content -Path $path -Value $updated -Encoding UTF8 -NoNewline
          Write-Host 'Selector XLSX compilado sin OFN_ENABLEHOOK ni callback.'

      - name: Build GestionSO V57
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe ./...

      - name: go vet
        shell: pwsh
        run: go vet ./...

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/datos | Out-Null
          Copy-Item 'acceso chatgpt/GestionSO_Datos.csv' 'dist/datos/GestionSO_Datos.csv'
          Copy-Item 'acceso chatgpt/archivo exportado.csv' 'dist/datos/archivo exportado.csv'
          Copy-Item 'acceso chatgpt/Archivo a importar.xlsx' 'dist/datos/Archivo a importar.xlsx'
          Set-Content -Path dist/LEEME.txt -Encoding UTF8 -Value @(
            'GestionSO V57 - reconstruccion'
            ''
            'Este ejecutable es una reconstruccion/reimplementacion en Go de GestionSO V57; no es el fuente original.'
            'Requiere Windows x64.'
            ''
            'El paquete incluye los datos base aportados para esta reconstruccion.'
            'La vista inicial carga archivo exportado.csv.'
            'GestionSO_Datos.csv queda disponible como maestro de datos.'
            'Archivo a importar.xlsx queda disponible para el flujo ABRIR XLSX.'
            ''
            'Blindaje de estabilidad: el selector XLSX se compila sin OFN_ENABLEHOOK/callback para evitar el bloqueo observado al abrir el dialogo.'
            ''
            'Para el flujo end-to-end con el motor legado puede requerirse GestionSO-V54-engine.exe.'
            'La ruta del motor se configura mediante la variable de entorno GESTIONSO_V54_ENGINE.'
            'El motor V54 no se inventa ni se sustituye por otro componente.'
          )
          Copy-Item README.md dist/README.md
          New-Item -ItemType Directory -Force dist/docs | Out-Null
          Copy-Item docs/EVIDENCIA_BINARIO.md dist/docs/EVIDENCIA_BINARIO.md
          Compress-Archive -Path dist/GestionSO-V57.exe,dist/LEEME.txt,dist/README.md,dist/docs/EVIDENCIA_BINARIO.md,dist/datos/* -DestinationPath dist/GestionSO-V57.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.zip
          if-no-files-found: error
          retention-days: 30
