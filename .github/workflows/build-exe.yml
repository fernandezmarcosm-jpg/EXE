name: Build GestionSO V57 Minimal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply duplicated-column fix
        if: github.event.head_commit.message != 'Fix: eliminar duplicación de columnas al usar COLUMNAS con encabezados físicos duplicados'
        shell: pwsh
        run: |
          python tools/fix_columns.py
          gofmt -w column_view_windows.go main_test.go

      - name: Go version
        shell: pwsh
        run: go version

      - name: Test
        shell: pwsh
        run: go test ./... -run TestDuplicatedPhysicalColumns -v

      - name: Vet
        shell: pwsh
        run: go vet ./...

      - name: Build EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags "-H=windowsgui" -o dist/GestionSO-V57.exe ./...
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'No se genero GestionSO-V57.exe' }

      - name: Commit fix
        if: github.event.head_commit.message != 'Fix: eliminar duplicación de columnas al usar COLUMNAS con encabezados físicos duplicados'
        shell: pwsh
        run: |
          git checkout HEAD^ -- .github/workflows/build-exe.yml
          Remove-Item tools/fix_columns.py -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add column_view_windows.go main_test.go .github/workflows/build-exe.yml tools/fix_columns.py
          git commit -m 'Fix: eliminar duplicación de columnas al usar COLUMNAS con encabezados físicos duplicados'
          git push origin HEAD:main

      - name: Package EXE
        if: github.event.head_commit.message == 'Fix: eliminar duplicación de columnas al usar COLUMNAS con encabezados físicos duplicados'
        shell: pwsh
        run: Compress-Archive -Path dist/GestionSO-V57.exe -DestinationPath dist/GestionSO-V57.zip -Force

      - name: Upload artifact
        if: github.event.head_commit.message == 'Fix: eliminar duplicación de columnas al usar COLUMNAS con encabezados físicos duplicados'
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.zip
          if-no-files-found: error
          retention-days: 30
