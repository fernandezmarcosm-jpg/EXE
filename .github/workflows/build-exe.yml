name: Build GestionSO V57 Functional

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Test core
        shell: pwsh
        run: go test ./...
      - name: Build Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags '-H=windowsgui' -o dist/GestionSO-V57.exe .
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'EXE no generado' }
      - name: Package runtime data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/datos | Out-Null
          Copy-Item 'acceso chatgpt/GestionSO_Datos.csv' 'dist/datos/GestionSO_Datos.csv'
          Copy-Item 'acceso chatgpt/Archivo a importar.xlsx' 'dist/datos/Archivo a importar.xlsx'
          Copy-Item 'acceso chatgpt/archivo exportado.csv' 'dist/datos/archivo exportado.csv'
          Set-Content dist/LEEME.txt @'
GestionSO V57 - reconstruccion funcional

ABRIR EXCEL: selecciona uno o varios XLSX.
El procesamiento ocurre fuera del hilo de la interfaz.
Los SKU se cruzan con datos/GestionSO_Datos.csv.
La grilla muestra columnas calculadas y columnas originales.
Filtro: use expresiones Columna=valor separadas por punto y coma.
COLUMNAS... permite elegir las columnas visibles.
EXPORTAR CSV guarda el resultado en la carpeta temporal de Windows.
archivo exportado.csv es solo un ejemplo de estructura y no es necesario para ejecutar.
'@
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath dist/GestionSO-V57.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.zip
          if-no-files-found: error
