name: Build GestionSO V57

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Test core
        shell: pwsh
        run: go test ./...
      - name: Build Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags '-H=windowsgui' -o dist/GestionSO-V57.exe .
          if (-not (Test-Path dist/GestionSO-V57.exe)) { throw 'EXE no generado' }
      - name: Package runtime data
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/datos | Out-Null
          Copy-Item 'acceso chatgpt/GestionSO_Datos.csv' 'dist/datos/GestionSO_Datos.csv'
          Copy-Item 'acceso chatgpt/Archivo a importar.xlsx' 'dist/datos/Archivo a importar.xlsx'
          Copy-Item 'acceso chatgpt/archivo exportado.csv' 'dist/datos/archivo exportado.csv'
          Set-Content dist/LEEME.txt @'
GestionSO V57 - reconstruccion funcional

1. Ejecute GestionSO-V57.exe.
2. ABRIR EXCEL permite seleccionar uno o varios archivos XLSX.
3. El programa procesa el XLSX en segundo plano y cruza los SKU con datos/GestionSO_Datos.csv.
4. La grilla muestra campos calculados y campos originales disponibles.
5. FILTRO acepta expresiones como SKU=PRE;Estado=RETENIDA;Cliente=EXXA.
6. COLUMNAS... permite elegir las columnas visibles.
7. EXPORTAR CSV genera GestionSO-V57-resultado.csv en la carpeta temporal de Windows.

archivo exportado.csv se incluye solamente como ejemplo de estructura/salida y no es necesario para ejecutar el programa.
'@
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath dist/GestionSO-V57.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestionSO-V57
          path: dist/GestionSO-V57.zip
          if-no-files-found: error
