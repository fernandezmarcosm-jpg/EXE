name: Fix XLSX dialog ABI

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[fix-open-xlsx]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair OPENFILENAMEW and multi-select parser
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('main_windows.go')
          s = p.read_text(encoding='utf-8')

          old_struct = '''type OPENFILENAMEW struct {
          LStructSize       uint32
          HwndOwner         uintptr
          HInstance         uintptr
          lpstrFilter       uintptr
          lpstrCustomFilter uintptr
          nMaxCustFilter    uint32
          nFilterIndex      uint32
          lpstrFile         uintptr
          nMaxFile           uint32
          lpstrFileTitle     uintptr
          nMaxFileTitle     uint32
          lpstrInitialDir    uintptr
          lpstrTitle         uintptr
          Flags              uint32
          nFileOffset        uint16
          nFileExtension     uint16
          lpstrDefExt        uintptr
          lCustData          uintptr
          lpfnHook           uintptr
          lpTemplateName     uintptr
          }
          '''

          new_struct = '''// OPENFILENAMEW must match the Win64 ABI exactly. The Windows structure has
          // pointer-alignment padding after lStructSize, nMaxFile and nMaxFileTitle and
          // also contains reserved/FlagsEx fields at the tail. A shorter Go struct makes
          // GetOpenFileNameW read the wrong offsets and can prevent the dialog from opening.
          // HECHO VERIFICADO: GetOpenFileNameW consumes an OPENFILENAMEW structure.
          // INFERENCIA/IMPLEMENTACION: unused padding/tail fields are left zeroed.
          type OPENFILENAMEW struct {
          	LStructSize       uint32
          	_pad0             uint32
          	HwndOwner         uintptr
          	HInstance         uintptr
          	lpstrFilter       uintptr
          	lpstrCustomFilter uintptr
          	nMaxCustFilter    uint32
          	nFilterIndex      uint32
          	lpstrFile         uintptr
          	nMaxFile          uint32
          	_pad1             uint32
          	lpstrFileTitle    uintptr
          	nMaxFileTitle     uint32
          	_pad2             uint32
          	lpstrInitialDir   uintptr
          	lpstrTitle        uintptr
          	Flags             uint32
          	nFileOffset       uint16
          	nFileExtension    uint16
          	lpstrDefExt       uintptr
          	lCustData         uintptr
          	lpfnHook          uintptr
          	lpTemplateName    uintptr
          	pvReserved        uintptr
          	dwReserved        uint32
          	FlagsEx            uint32
          }
          '''

          if old_struct not in s:
              raise SystemExit('OPENFILENAMEW old definition not found; aborting without changes')
          s = s.replace(old_struct, new_struct, 1)

          old_parser = '''func parseMultiSelectBuffer(buf []uint16) []string {
          	if len(buf) == 0 || buf[0] == 0 {
          		return nil
          	}
          	first := syscall.UTF16ToString(buf)
          	end := len(first)
          	if end+1 >= len(buf) || buf[end+1] == 0 {
          		return []string{first}
          	}
          	dir := first
          	result := []string{}
          	i := end + 1
          	for i < len(buf) && buf[i] != 0 {
          		j := i
          		for j < len(buf) && buf[j] != 0 {
          			j++
          		}
          		name := syscall.UTF16ToString(buf[i:j])
          		if name != "" {
          			result = append(result, filepathJoin(dir, name))
          		}
          		i = j + 1
          	}
          	return result
          }
          '''

          new_parser = '''func parseMultiSelectBuffer(buf []uint16) []string {
          	if len(buf) == 0 || buf[0] == 0 {
          		return nil
          	}
          	// El buffer se indexa en unidades UTF-16; len(string) mide bytes.
          	// Usar len(UTF16ToString(...)) puede romper el cálculo del segundo NUL
          	// cuando la ruta contiene caracteres no ASCII.
          	end := 0
          	for end < len(buf) && buf[end] != 0 {
          		end++
          	}
          	first := syscall.UTF16ToString(buf[:end])
          	if end+1 >= len(buf) || buf[end+1] == 0 {
          		return []string{first}
          	}
          	dir := first
          	result := []string{}
          	i := end + 1
          	for i < len(buf) && buf[i] != 0 {
          		j := i
          		for j < len(buf) && buf[j] != 0 {
          			j++
          		}
          		name := syscall.UTF16ToString(buf[i:j])
          		if name != "" {
          			result = append(result, filepathJoin(dir, name))
          		}
          		i = j + 1
          	}
          	return result
          }
          '''

          if old_parser not in s:
              raise SystemExit('parseMultiSelectBuffer old definition not found; aborting without changes')
          s = s.replace(old_parser, new_parser, 1)
          p.write_text(s, encoding='utf-8')

      - name: Verify source build and vet
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          gofmt -w main_windows.go
          go build ./...
          go vet ./...

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main_windows.go
          git diff --cached --quiet && exit 0
          git commit -m "fix-open-xlsx: correct Win64 OPENFILENAMEW ABI [fix-open-xlsx]"
          git push
