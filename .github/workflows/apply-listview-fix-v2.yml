name: Apply ListView fix v2
on:
  push:
    branches: [fix/listview-repaint-deleteobject-v2]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[listview-v2-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          p=Path('column_view_windows.go')
          s=p.read_text()
          s=s.replace('const(lvmSetExtended=0x1036;', 'const(lvmGetItemRect=0x100E;lvmSetExtended=0x1036;', 1)
          s=s.replace('if viewFont!=0{user32.NewProc("DeleteObject").Call(viewFont);viewFont=0}', 'if viewFont!=0{gdi:=syscall.NewLazyDLL("gdi32.dll");gdi.NewProc("DeleteObject").Call(viewFont);viewFont=0}', 1)
          s=s.replace('if viewFont!=0{user32.NewProc("DeleteObject").Call(viewFont)};gdi:=syscall.NewLazyDLL("gdi32.dll")', 'if viewFont!=0{gdi:=syscall.NewLazyDLL("gdi32.dll");gdi.NewProc("DeleteObject").Call(viewFont)};gdi:=syscall.NewLazyDLL("gdi32.dll")', 1)
          p.write_text(s)
          p=Path('windows_safe_view.go')
          s=p.read_text()
          old='columnViewApplyFont();user32.NewProc("InvalidateRect").Call(viewList,0,0,1);user32.NewProc("UpdateWindow").Call(viewList);appLog("DIAGNOSTICO: render síncrono completo; registros=%d",len(records))'
          new='''columnViewApplyFont();var clientRect struct{Left,Top,Right,Bottom int32};user32.NewProc("GetClientRect").Call(viewList,uintptr(unsafe.Pointer(&clientRect)));appLog("DIAGNOSTICO: listview client rect left=%d top=%d right=%d bottom=%d width=%d height=%d",clientRect.Left,clientRect.Top,clientRect.Right,clientRect.Bottom,clientRect.Right-clientRect.Left,clientRect.Bottom-clientRect.Top);if count>0{var itemRect struct{Left,Top,Right,Bottom int32};itemRect.Left=0;ok,_,_:=user32.NewProc("SendMessageW").Call(viewList,lvmGetItemRect,0,uintptr(unsafe.Pointer(&itemRect)));appLog("DIAGNOSTICO: item 0 rect ok=%d left=%d top=%d right=%d bottom=%d width=%d height=%d",ok,itemRect.Left,itemRect.Top,itemRect.Right,itemRect.Bottom,itemRect.Right-itemRect.Left,itemRect.Bottom-itemRect.Top)};user32.NewProc("InvalidateRect").Call(viewList,0,1);user32.NewProc("UpdateWindow").Call(viewList);appLog("DIAGNOSTICO: repintado forzado InvalidateRect+UpdateWindow; item count en listview=%d",int(count));appLog("DIAGNOSTICO: render síncrono completo; registros=%d",len(records))'''
          if old not in s: raise SystemExit('safe-view target not found')
          p.write_text(s.replace(old,new,1))
          if 'user32.NewProc("DeleteObject")' in Path('column_view_windows.go').read_text(): raise SystemExit('user32 DeleteObject remains')
      - name: Commit generated fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add column_view_windows.go windows_safe_view.go
          git commit -m "Fix ListView repaint diagnostics and DeleteObject DLL [listview-v2-generated]"
          git push
