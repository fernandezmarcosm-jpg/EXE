name: Apply virtual ListView correction
on:
  push:
    branches: [fix/listview-virtual-v3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('column_view_windows.go')
          s = p.read_text(encoding='utf-8')
          s=re.sub(r'(lvsOwnerData=0x1000;lvmSetItemCountEx=0x102F;)+','lvsOwnerData=0x1000;lvmSetItemCountEx=0x102F;',s,count=1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column_view_windows.go
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: deduplicate virtual ListView constants"
          git push
