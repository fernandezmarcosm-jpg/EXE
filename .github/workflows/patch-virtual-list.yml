name: Apply virtual ListView correction
on:
  push:
    branches: [fix/listview-virtual-v3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('column_view_windows.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('lvsReport=1;', 'lvsReport=1;lvsOwnerData=0x1000;lvmSetItemCountEx=0x102F;')
          s = s.replace('WS_CHILD|WS_VISIBLE|WS_BORDER|WS_TABSTOP|lvsReport,0,0,100,100,appIDView', 'WS_CHILD|WS_VISIBLE|WS_BORDER|WS_TABSTOP|lvsReport|lvsOwnerData,0,0,100,100,appIDView')
          old = '''\t\t\tif ri<len(records) && ci<len(visible) {\n\t\t\t\ttxt:=datasetCellText(records[ri],visible[ci])'''
          new = '''\t\t\tif ri<len(records) && ci<len(visible) {\n\t\t\t\ttxt:=datasetCellText(records[ri],visible[ci])\n\t\t\t\tif appSettings.SubtotalEnabled && appSettings.SubtotalColumn!="" && ri==len(records) {\n\t\t\t\t\ttxt=safeSubtotalCellText(visible,records,ci)\n\t\t\t\t}'''
          if old not in s:
              raise SystemExit('handler anchor not found')
          s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p = Path('windows_safe_view.go')
          s = p.read_text(encoding='utf-8')
          start = s.index('func columnViewRefreshSafe()')
          end = s.index('\nfunc safeSnapshotFilters()', start)
          fn = r'''func columnViewRefreshSafe(){defer appRecover("columnViewRefreshSafe");if viewList==0{return};columnViewDeleteColumns();send:=user32.NewProc("SendMessageW");send.Call(viewList,lvmDeleteAll,0,0);if viewDataset==nil{return};visible:=columnViewVisibleColumns();for i,c:=range visible{p:=appU16(datasetColumnDisplayTitle(c));fmtCol:=lvcfmtLeft;if c.Type==ValueNumber{fmtCol=lvcfmtRight};width:=c.Width;if width<120{width=120};if width>420{width=420};lc:=lvColumn{Mask:lvcfText,Fmt:int32(fmtCol),Cx:int32(width),Text:p,SubItem:int32(i)};send.Call(viewList,lvmInsertColumnW,uintptr(i),uintptr(unsafe.Pointer(&lc)))};records:=safeFilterRecords(viewDataset,safeSnapshotFilters());itemCount:=len(records);if appSettings.SubtotalEnabled&&appSettings.SubtotalColumn!=""{itemCount++};setCount,_,_:=send.Call(viewList,lvmSetItemCountEx,uintptr(itemCount),0);appLog("DIAGNOSTICO: ListView virtual; registros=%d itemCount=%d LVM_SETITEMCOUNTEX=%d",len(records),itemCount,int(setCount));columnViewAutoFit(visible);columnViewLayoutFilters(currentClientWidth());columnViewApplyFont();var clientRect struct{Left,Top,Right,Bottom int32};user32.NewProc("GetClientRect").Call(viewList,uintptr(unsafe.Pointer(&clientRect)));appLog("DIAGNOSTICO: listview client rect left=%d top=%d right=%d bottom=%d width=%d height=%d",clientRect.Left,clientRect.Top,clientRect.Right,clientRect.Bottom,clientRect.Right-clientRect.Left,clientRect.Bottom-clientRect.Top);if itemCount>0{var itemRect struct{Left,Top,Right,Bottom int32};itemRect.Left=0;ok,_,_:=send.Call(viewList,lvmGetItemRect,0,uintptr(unsafe.Pointer(&itemRect)));appLog("DIAGNOSTICO: item 0 rect ok=%d left=%d top=%d right=%d bottom=%d width=%d height=%d",ok,itemRect.Left,itemRect.Top,itemRect.Right,itemRect.Bottom,itemRect.Right-itemRect.Left,itemRect.Bottom-itemRect.Top)};var windowRect struct{Left,Top,Right,Bottom int32};getWindowRect:=user32.NewProc("GetWindowRect");mapWindowPoints:=user32.NewProc("MapWindowPoints");if ret,_,_:=getWindowRect.Call(viewList,uintptr(unsafe.Pointer(&windowRect)));ret!=0{mapWindowPoints.Call(0,appHwnd,uintptr(unsafe.Pointer(&windowRect)),2);appLog("DIAGNOSTICO: listview window rect coords padre left=%d top=%d right=%d bottom=%d width=%d height=%d",windowRect.Left,windowRect.Top,windowRect.Right,windowRect.Bottom,windowRect.Right-windowRect.Left,windowRect.Bottom-windowRect.Top)};header,_,_:=send.Call(viewList,lvmGetHeader,0,0);if header!=0{var headerRect struct{Left,Top,Right,Bottom int32};if ret,_,_:=getWindowRect.Call(header,uintptr(unsafe.Pointer(&headerRect)));ret!=0{appLog("DIAGNOSTICO: header rect screen left=%d top=%d right=%d bottom=%d width=%d height=%d",headerRect.Left,headerRect.Top,headerRect.Right,headerRect.Bottom,headerRect.Right-headerRect.Left,headerRect.Bottom-headerRect.Top)}};user32.NewProc("InvalidateRect").Call(viewList,0,1);user32.NewProc("UpdateWindow").Call(viewList);user32.NewProc("InvalidateRect").Call(appHwnd,0,1);flags:=uintptr(0x1|0x4|0x100|0x80);user32.NewProc("RedrawWindow").Call(viewList,0,0,flags);appLog("DIAGNOSTICO: repintado virtual forzado; item count=%d",itemCount);appLog("DIAGNOSTICO: render síncrono completo; registros=%d",len(records))}'''
          s = s[:start] + fn + s[end:]
          helper = r'''\nfunc safeSubtotalCellText(visible []DatasetColumn,records []DatasetRecord,ci int)string{if ci<0||ci>=len(visible){return ""};c:=visible[ci];targets:=map[string]bool{};if len(appSettings.SubtotalColumns)>0{for _,t:=range appSettings.SubtotalColumns{targets[strings.ToLower(strings.TrimSpace(t))]=true}}else if appSettings.SubtotalColumn!=""{targets[strings.ToLower(strings.TrimSpace(appSettings.SubtotalColumn))]=true};if ci==0&&!targets[strings.ToLower(strings.TrimSpace(c.Title))]&&!targets[strings.ToLower(strings.TrimSpace(datasetColumnDisplayTitle(c)))]{return "SUBTOTAL"};if !targets[strings.ToLower(strings.TrimSpace(c.Title))]&&!targets[strings.ToLower(strings.TrimSpace(datasetColumnDisplayTitle(c)))]{return ""};sum:=0.0;for _,r:=range records{if v,ok:=r.Values[c.ID];ok&&v.Type==ValueNumber{sum+=v.Number}};if datasetColumnIsPercent(c){sum*=100;return formatDatasetNumber(sum,datasetColumnDecimals(c))+"%"};return formatDatasetNumber(sum,datasetColumnDecimals(c))}\n'''
          anchor='\nfunc safeSnapshotFilters()'
          s=s.replace(anchor,helper+anchor,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column_view_windows.go windows_safe_view.go
          git diff --cached --check
          git commit -m "fix: render ListView through virtual data callbacks"
          git push
