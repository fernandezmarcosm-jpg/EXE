name: Apply virtual ListView correction
on:
  push:
    branches: [fix/listview-virtual-v3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sources
        shell: python
        run: |
          from pathlib import Path

          p = Path('column_view_windows.go')
          s = p.read_text(encoding='utf-8')
          old = '''\t\t\tif ri<len(records) && ci<len(visible) {\n\t\t\t\ttxt:=datasetCellText(records[ri],visible[ci])\n\t\t\t\tif appSettings.SubtotalEnabled && appSettings.SubtotalColumn!="" && ri==len(records) {\n\t\t\t\t\ttxt=safeSubtotalCellText(visible,records,ci)\n\t\t\t\t}'''
          new = '''\t\t\tif ci<len(visible) && ri>=0 && ri<=len(records) {\n\t\t\t\ttxt:=""\n\t\t\t\tif ri<len(records) {\n\t\t\t\t\ttxt=datasetCellText(records[ri],visible[ci])\n\t\t\t\t} else if appSettings.SubtotalEnabled && appSettings.SubtotalColumn!="" {\n\t\t\t\t\ttxt=safeSubtotalCellText(visible,records,ci)\n\t\t\t\t} else {\n\t\t\t\t\treturn false\n\t\t\t\t}'''
          if old in s:
              s = s.replace(old,new,1)
          start=s.index('func columnViewRefresh()')
          end=s.index('\nfunc datasetCellText(',start)
          s=s[:start]+'func columnViewRefresh(){columnViewRefreshSafe()}'+s[end:]
          p.write_text(s,encoding='utf-8')

          p = Path('windows_safe_view.go')
          s = p.read_text(encoding='utf-8')
          s=s.replace(r'\\nfunc safeSubtotalCellText','\nfunc safeSubtotalCellText')
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add column_view_windows.go windows_safe_view.go
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: complete virtual ListView callback path"
          git push
